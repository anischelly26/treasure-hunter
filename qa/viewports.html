<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio responsive QA</title><style>body{margin:0;background:#292a29;color:#eee;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{padding:10px;background:#121412;color:#eed49c;border:1px solid #645439;cursor:pointer}iframe{display:block;margin:0 auto;width:390px;height:844px;max-width:100%;border:0}output{margin-left:auto}</style><header>Responsive QA <button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><button id="original">Original</button><button id="restored">Restored</button><output>390 × 844</output></header><iframe title="Portfolio preview" src="../index.html"></iframe><script>const frame=document.querySelector('iframe'),out=document.querySelector('output');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';out.textContent=b.dataset.width+' × 844'});document.querySelector('#original').onclick=()=>frame.src='../playground.html';document.querySelector('#restored').onclick=()=>frame.src='../index.html';</script></html>
