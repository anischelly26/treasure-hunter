name: Verify CV RAG Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render auto-deploy
        run: sleep 45

      - name: Verify live health endpoint
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "Health attempt ${attempt}/5"
            if curl -fsS --max-time 60 https://anischelly26-cv-rag.onrender.com/health -o health.json; then
              cat health.json
              python -c "import json; d=json.load(open('health.json')); assert d.get('ok') is True, d; assert d.get('retriever_ready') is True, d; print('Health OK:', d.get('version'), d.get('model'))"
              ok=1
              break
            fi
            sleep 30
          done
          test "$ok" -eq 1

      - name: Verify live recruiter question
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 75 \
            -X POST https://anischelly26-cv-rag.onrender.com/ask \
            -H 'Content-Type: application/json' \
            --data '{"question":"What did Anis build at Vermeg?"}' \
            -o answer.json
          cat answer.json
          python -c "import json; d=json.load(open('answer.json')); a=d.get('answer',''); assert isinstance(a,str) and len(a.strip())>20,d; assert 'temporarily unavailable' not in a.lower(),d; assert d.get('sources'),d; print('Production answer OK:', d.get('retrieval_mode'), d.get('model'))"
