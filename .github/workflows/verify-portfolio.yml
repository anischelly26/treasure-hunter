name: Verify Portfolio

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check project-demos.js
          node --check treasure-browser.js
          node --check treasure-project.js
          node --check rag-bootstrap.js
          node --check rag.js
          node --check interactive-lab.js
          node --check scene.js
          node --check script.js
          node --check alpine.js
          node --check alpine-scene.js
          node --check restored.js
          node --check case-studies.js
          node --check portfolio-features.js
          node --check signal-scene.js
          node --check case-studies/form-case.js
          node --check qa/verify-form.mjs
      - name: Install verification dependencies
        run: npm ci --prefix qa
      - name: Install Chromium
        run: npx --prefix qa playwright install --with-deps chromium
      - name: Verify FORM portfolio journey
        run: npm test --prefix qa
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: qa/evidence
