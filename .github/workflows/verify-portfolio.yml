name: Verify Portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check source-backed-lab-v2.js
          node --check interactive-lab.js
          node --check treasure-project.js
          node --check scene.js
          node --check script.js
