services:
  - type: web
    name: anischelly26-cv-rag
    runtime: python
    plan: free
    rootDir: rag-api
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.5
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: ALLOWED_ORIGINS
        value: https://anischelly26.github.io
      - key: RATE_LIMIT_COUNT
        value: "8"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      - key: MIN_SIMILARITY
        value: "0.24"
      - key: TOP_K
        value: "4"
